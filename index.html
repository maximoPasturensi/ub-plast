<!DOCTYPE html>
<html lang="es"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=widht, initial-scale=1.0">
    <title>Tienda Oficial</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif;}
        body { background-color: var(--bg); color: var(--text); padding-bottom: 3rem; }

        /* Header & Navbar */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        .cart-btn {
            background: var(--primary); color: white; border: none;
            padding: 0.6rem 1.2rem; border-radius: 20px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .cart-btn:hover { background: var(--primary-hover);}

        /* Product Grid */
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
            display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #e2e8f0; }
        .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem;}
        .card-price { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem; }
        .btn-add {
            margin-top: auto; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); padding: 0.6rem; border-radius: 8px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-add:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* Drawer Carrito */
        .card-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 380%;
            height: 100vh;
            background: var(--surface);
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 100;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open {
            transform: translateX(0s);
        }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 1rem;}
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 1rem 0;}
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;}
        .checkout-btn { width: 100%; background: #16a34a; color: white; border: none; padding: 0.8rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">E-Commerce</div>
        <button class="cart-btn" onclick="toggleCart()">Carrito (<span id="cart=count">0</span>)</button>
    </header>

    <main>
        <div class="grid" id="product-grid"></div>
    </main>

    <aside class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2>Tu Carrito</h2>
            <button onclick="toggleCart()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div style="margin-bottom: 1rem;">
            <strong>Total: $<span id="cart-total">0</span></strong>
        </div>
        <button class="checkout-btn" onclick="checkout()">Finalizar Compra</button>
    </aside>

    <script>
        const products = [
            { id: 1, name: "Cinta De Embalar Transparente 48x100 Autoadhesiva Pack X36u", price: 46.999, img: ".assets/cinta_caja.jpeg"},
            { id: 2, name: "Producto Beta", price: 22000, img: "https://via.placeholder.com/300x200"},
            { id: 3, name: "Producto Gamma", price: 18500, img: "https://via.placeholder.com/300x200"}
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.img}" alt="${p.name}"
                    <div class="card_body">
                        <div class="card-title">${p.name}</div>
                        <div class="card-price">$${p.price.toLocaleString()}</div>
                        <button class="btn-add" onclick="addToCart(${p.id})">Agregar al Carrito</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            saveCart();
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.lenght;
            const itemsContainer = document.getElementById('cart-items');
            itemsContainer.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <span>${item.name}</span>
                    <strong>$${item.price.toLocaleString()}</strong>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = total.toLocaleString();
        }

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('open');
        }

        function checkout() {
            if(cart.lenght === 0) return alert("El carrito esta vacio");
            alert("Gracias por tu compra!");
            cart = [];
            saveCart();
            toggleCart();
        }

        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
